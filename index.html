<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Botonoids</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; }
      canvas {display: block; margin: 0 auto; }
    </style>
  </head>
  <body>
  <div id="game-wrap">
    <canvas id="game" width="960" height="540"></canvas>

    <div id="lobby">
      <div class="lobby-card">
        <h1>Lobby</h1>
        <p>Press Enter</p>
        <!-- add inputs/buttons here later -->
         <div id="lobby">
          <div class="lobby-panel">

            <div class="lobby-col lobby-left">
              <h2>Select Botonoid</h2>

              <div class="botonoid-preview">
                <!-- TS will draw over this area -->
              </div>

              <div class="section">
                <div class="label">Color</div>
                <div class="btn-row">
                  <button>Gold</button>
                  <button>Silver</button>
                  <button>White</button>
                  <button>Black</button>
                </div>
                <div class="btn-row">
                  <button>Random</button>
                  <button>Observer</button>
                </div>
              </div>

              <div class="section">
                <div class="label">Skin</div>
                <div class="btn-row">
                  <button>Alphanoid</button>
                  <button>Herbanoid</button>
                  <button>Barvinoid</button>
                </div>
              </div>

              <div class="section ready-row">
                <button class="ready-btn">Ready</button>
                <span class="ready-status">✔ waiting for others...</span>
              </div>
            </div>

            <div class="lobby-col lobby-right">
              <h2>Enter Name</h2>
              <input type="text" placeholder="Your name" />

              <div class="section">
                <div class="label">Players</div>
                <div class="players-grid">
                  <!-- 3 x 2 grid items -->
                  <div class="player-card">Player 1</div>
                  <div class="player-card">Player 2</div>
                  <div class="player-card">Player 3</div>
                  <div class="player-card">Player 4</div>
                  <div class="player-card">Player 5</div>
                  <div class="player-card">Player 6</div>
                </div>
              </div>

              <div class="section chat-section">
                <div class="label">Chat</div>
                <div class="chat-log"></div>
                <input type="text" class="chat-input" placeholder="Type message..." />
              </div>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
