<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Botonoids</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; }
      canvas {display: block; margin: 0 auto; }
    </style>
  </head>
  <body>
  <div id="game-wrap">
    <canvas id="game" width="992" height="580"></canvas>

    <div id="rooms-browser">
      <div class="rooms-card">
        <div class="rooms-title">Botonoids</div>
        <div class="rooms-layout">
          <div class="rooms-main-col">
            <h2>Rooms</h2>
            <div class="rooms-actions">
              <input id="room-name-input" type="text" placeholder="Room name" />
              <button id="create-room-btn">Create Room</button>
              <button id="refresh-rooms-btn">Refresh</button>
            </div>
            <div id="rooms-list"></div>
            <p id="rooms-error" class="rooms-error"></p>
          </div>
          <div class="rooms-side-col">
            <button id="rooms-options-btn">Options</button>
            <button id="rooms-how-to-play-btn" disabled>How to Play</button>
            <button id="rooms-story-btn" disabled>Story</button>
            <button id="rooms-credits-btn" disabled>Credits</button>
          </div>
        </div>
      </div>
    </div>

    <div id="lobby">
      <div class="lobby-card">
        <div class="lobby-inner">
          <div class="lobby-panel">

            <!-- LEFT COLUMN -->
            <div class="lobby-col lobby-left">
              <h3>Select Botonoid</h3>

              <div class="color-row">
                <div class="color-col">
                  <button class="gold role-btn" data-model="goldBot">Gold</button>
                  <button class="silver role-btn" data-model="silverBot">Silver</button>
                </div>
                <div class="botonoid-preview">
                  <canvas id="botonoid-preview-canvas" width="96" height="96"></canvas>
                </div>
                <div class="color-col">
                  <button class="white role-btn" data-model="whiteBot">White</button>
                  <button class="black role-btn" data-model="blackBot">Black</button>
                </div>
              </div>
              

              <div class="section">
            
                <div class="btn-row">
                  <!-- randomColor is the default, so that's why it has the "selected" class to start -->
                  <button class="randomColor role-btn" data-model="randomBot">Random color</button>
                  <button class="role-btn" data-model="observer">Observer</button>
                </div>
              </div>

              <div class="section">
                <div class="label">Robot model</div>
                <div class="btn-row model-row">
                  <button class="model-btn selected" data-model="alphanoid">Alphanoid</button>
                  <button class="model-btn" data-model="herbanoid">Herbanoid</button>
                  <button class="model-btn" data-model="barvinoid">Barvinoid</button>
                  <button class="model-btn randomnoid" data-model="randomnoid">Randomnoid</button>
                </div>
              </div>

              <div class="section">
                <div class="label">Players</div>
                <div class="players-grid">
                  <!-- 3 x 2 grid items -->
                  <div class="player-card">-</div>
                  <div class="player-card">-</div>
                  <div class="player-card">-</div>
                  <div class="player-card">-</div>
                  <div class="player-card">-</div>
                  <div class="player-card">-</div>
                </div>
              </div>
              <div class="section ready-row">
                <button id="lobby-back-btn" class="back-btn">Back</button>
                <button id="lobby-options-btn">Options</button>
                <span class="ready-row-spacer" aria-hidden="true"></span>
                <button class="ready-btn">Ready</button>
                <!--<span class="ready-status">✔ waiting for others...</span> -->
              </div>
            </div>

            <!-- RIGHT COLUMN -->
            <div class="lobby-col lobby-right">
              <div class="name-row">
                <div class="label" id="current-player-name">Player</div>
                <input id="name-input" class="text-input-name" type="text" placeholder="Your name" />
                <button class="change-name" id="name-set-btn">Change name</button>
              </div>


              <div class="section chat-section">
                <div class="label">Chat</div>
                <div class="chat-log"></div>
                <div class="row">
                  <input id="chat-input" type="text" class="chat-input text-input" placeholder="Type message..." />
                  <button id="chat-send-btn">Send</button>
                </div>
              </div>
              
            </div>

          </div>
        </div>

      </div>
    </div>

    <div id="solo-practice-dialog" class="solo-practice-dialog" style="display: none;">
      <div class="solo-practice-card">
        <p>Hello! You are creating a game with only one player. You can do this if you want to practice, or you can cancel if this was an error.</p>
        <div class="solo-practice-actions">
          <button id="solo-practice-cancel-btn">Cancel</button>
          <button id="solo-practice-confirm-btn">Practice</button>
        </div>
      </div>
    </div>

    <div id="in-game-menu-root" class="in-game-menu-root" style="display: none;">
      <button id="in-game-menu-toggle-btn" class="in-game-menu-toggle-btn" aria-label="Open menu">☰</button>
      <div id="in-game-menu-panel" class="in-game-menu-panel" style="display: none;">
        <button id="in-game-menu-options-btn">Options</button>
        <button id="in-game-menu-quit-btn">Quit game</button>
        <button id="in-game-menu-close-btn">Close menu</button>
      </div>
    </div>

    <div id="options-overlay" class="options-overlay" style="display: none;">
      <div id="options-dialog" class="options-dialog" role="dialog" aria-modal="true" aria-labelledby="options-title">
        <div class="options-header">
          <h2 id="options-title">Options</h2>
          <button id="options-close-btn" aria-label="Close options">Close</button>
        </div>
        <div class="options-tabs">
          <button id="options-tab-controls-btn" class="selected">Controls</button>
          <button id="options-tab-audio-btn">Audio</button>
        </div>
        <div id="options-controls-tab" class="options-tab-panel">
          <div id="options-controls-warning" class="options-warning"></div>
          <div id="options-controls-list" class="options-controls-list"></div>
          <div class="options-footer-row">
            <button id="options-controls-reset-btn">Reset Controls</button>
          </div>
        </div>
        <div id="options-audio-tab" class="options-tab-panel" style="display: none;">
          <div class="options-audio-row music-choice-row">
            <span>In-Game Music</span>
            <div id="options-music-choice-buttons" class="options-music-buttons">
              <button id="options-music-btn-puzzler" data-choice="puzzler">Puzzler</button>
              <button id="options-music-btn-happy" data-choice="happy">Happy</button>
              <button id="options-music-btn-epic" data-choice="epic">Epic</button>
              <button id="options-music-btn-random" data-choice="random">Random</button>
            </div>
          </div>
          <div class="options-audio-row music-volume-row">
            <label for="options-music-volume-range">Music Volume</label>
            <input id="options-music-volume-range" type="range" min="0" max="100" step="1" />
            <span id="options-music-volume-value">0%</span>
          </div>
          <div class="options-audio-row">
            <label for="options-sfx-volume-range">SFX Volume</label>
            <input id="options-sfx-volume-range" type="range" min="0" max="100" step="1" />
            <span id="options-sfx-volume-value">0%</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
