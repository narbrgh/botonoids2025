<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Botonoids</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; }
      canvas {display: block; margin: 0 auto; }
    </style>
  </head>
  <body>
  <div id="game-wrap">
    <canvas id="game" width="960" height="540"></canvas>

    <div id="lobby">
      <div class="lobby-card">
        <h1>Lobby</h1>
        <p>Press Enter</p>
        <!-- add inputs/buttons here  -->
         <div id="lobby">
          <div class="lobby-panel">

            <div class="lobby-col lobby-left">
              <h3>Select Botonoid</h3>

              <div class="color-row">
                <div class="color-col">
                  <button class="gold role-btn">Gold</button>
                  <button class="silver role-btn">Silver</button>
                </div>
                <div class="botonoid-preview">
                  <!-- TS will draw over this area -->
                </div>
                <div class="color-col">
                  <button class="white role-btn">White</button>
                  <button class="black role-btn">Black</button>
                </div>
              </div>
              

              <div class="section">
            
                <div class="btn-row">
                  <button class="randomColor role-btn">Random color</button>
                  <button class="role-btn">Observer</button>
                </div>
              </div>

              <div class="section">
                <div class="label">Robot model</div>
                <div class="btn-row">
                  <button>Alphanoid</button>
                  <button>Herbanoid</button>
                  <button>Barvinoid</button>
                </div>
              </div>

              <div class="section">
                <div class="label">Player status</div>
                <div class="players-grid">
                  <!-- 3 x 2 grid items -->
                  <div class="player-card"></div>
                  <div class="player-card"></div>
                  <div class="player-card"></div>
                  <div class="player-card"></div>
                  <div class="player-card">Player 5</div>
                  <div class="player-card">Player 6</div>
                </div>
              </div>
              <div class="section ready-row">
                <button class="ready-btn">Ready</button>
                <span class="ready-status">✔ waiting for others...</span>
              </div>
            </div>

            <div class="lobby-col lobby-right">
              <h3>Enter Name
              <div class="row">
                <input type="text" placeholder="Your name" />
                <button>Set</button>
              </div>
              </h3>

              <div class="section chat-section">
                <div class="label">Chat</div>
                <div class="chat-log"></div>
                <div class="row">
                  <input type="text" class="chat-input" placeholder="Type message..." />
                  <button>Send</button>
                </div>
              </div>
              
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
